name: Atualizar entorno (ruas e relevo)

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch_entorno.py
      - .github/workflows/entorno.yml
  schedule:
    - cron: '17 6 1 * *'   # todo dia 1º, para pegar ruas novas do OpenStreetMap

permissions:
  contents: write

jobs:
  entorno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/fetch_entorno.py
      - name: Salvar no site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "Atualiza entorno em cache (ruas e relevo)"
          git push
